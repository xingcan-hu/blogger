[project]
name = "blogger-publisher"
version = "0.1.0"
description = "Publish posts to Blogger with the Blogger API"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4==4.13.4",
  "bleach==6.2.0",
  "google-api-python-client==2.179.0",
  "google-auth-oauthlib==1.2.2",
  "markdown-it-py==4.0.0",
  "mdit-py-plugins==0.5.0",
  "pillow>=12.3.0",
  "python-frontmatter==1.1.0",
]

[project.scripts]
blogger = "blogger_publisher.cli:main"

[dependency-groups]
dev = ["pytest==8.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blogger_publisher"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
